<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Reservas de Laboratórios</title><link rel="stylesheet" href="styles.css"></head><body><main><h1>Reservas de Laboratórios</h1><p id="msg"></p><form id="form"><input id="id" type="hidden"><label>Laboratório<input id="laboratorio" required minlength="2"></label><label>Responsável<input id="responsavel" required minlength="2"></label><label>Data<input id="data" type="date" required></label><label>Turno<select id="turno"><option value="manha">Manhã</option><option value="tarde">Tarde</option><option value="noite">Noite</option></select></label><label>Finalidade<input id="finalidade" required minlength="3"></label><label>Quantidade de alunos<input id="quantidade-alunos" type="number" min="1" max="40" required></label><label>Status<select id="status"><option value="confirmada">Confirmada</option><option value="pendente">Pendente</option><option value="cancelada">Cancelada</option></select></label><button>Salvar</button><button type="button" id="cancelar">Limpar edição</button></form><section class="filters"><input id="busca" placeholder="Filtrar laboratório"><select id="fstatus"><option value="">Todos os status</option><option>confirmada</option><option>pendente</option><option>cancelada</option></select><button id="filtrar">Filtrar</button></section><table><thead><tr><th>Laboratório</th><th>Data</th><th>Turno</th><th>Responsável</th><th>Status</th><th>Alunos</th><th>Ações</th></tr></thead><tbody id="lista"></tbody></table></main><script src="app.js?v=3"></script></body></html>
